# Read the Docs configuration (v2).
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# After merging this file:
#   1. Sign in at https://readthedocs.org with the GitHub account that owns this repo.
#   2. "Import a Project" -> select workfloworchestrator/aruba-client.
#   3. RTD auto-detects this file; no extra settings required.
#   4. First build triggers automatically; subsequent builds trigger via the
#      GitHub webhook RTD installs for you.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

# Documentation dependencies are the `docs` dependency group in pyproject.toml, resolved
# from the committed uv.lock. Read the Docs installs uv through this native option
# (`method: uv`); it runs `uv sync --group docs`, which honours uv.lock when it is up to
# date and otherwise re-resolves. CI runs the same group with `--locked`, so a stale lock
# fails there first.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
