[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aruba-client"
version = "0.2.0"
description = "Aruba Central MSP client — typed wrappers around the network-monitoring API"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SURF", email = "info@surf.nl" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx[http2]",
    "pycentral==2.0a22",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=25.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx>=0.29.0",
    "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/workfloworchestrator/aruba-client"
Documentation = "https://aruba-client.readthedocs.io"
Repository = "https://github.com/workfloworchestrator/aruba-client"

[tool.hatch.build.targets.wheel]
packages = ["aruba_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
