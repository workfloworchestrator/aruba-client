[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aruba-client"
version = "0.2.2"
description = "Aruba Central MSP client — typed wrappers around the network-monitoring API"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SURF", email = "info@surf.nl" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx[http2]",
    "pycentral==2.0a22",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=25.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx>=0.29.0",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
# MkDocs-based documentation stack. Development-only: never published as runtime deps.
docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.5",
    "pymdown-extensions~=10.9",
    "mkdocs-include-markdown-plugin~=7.0",
    "mkdocs-git-revision-date-localized-plugin~=1.2",
]

[project.urls]
Homepage = "https://github.com/workfloworchestrator/aruba-client"
Documentation = "https://aruba-client.readthedocs.io"
Repository = "https://github.com/workfloworchestrator/aruba-client"

[tool.uv]
# Same three-day release age as Renovate's `minimumReleaseAge` in the shared config, so a
# lock regeneration never picks a release that Renovate would still consider too new.
# Vulnerability fixes younger than three days need the exempt-rebuild procedure.
exclude-newer = "3 days"

[tool.hatch.build.targets.wheel]
packages = ["aruba_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
