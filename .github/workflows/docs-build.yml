# Called by ci.yml only: the triggers live there, so one PR run produces one set of checks.
#
# No `paths:` filter here on purpose. A repository-level path filter would leave this job
# out of a PR that only touches pyproject.toml/uv.lock (a Renovate PR, for instance), and a
# check that is required by the ruleset then never reports, which blocks the PR forever.
# The strict build takes about a minute, so it runs on every PR instead.
name: Docs build

on:
  workflow_call:

jobs:
  build:
    name: Build mkdocs site
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/docs.txt
      - name: Build docs (strict)
        run: mkdocs build --strict
