# Called by ci.yml only: the triggers live there, so one PR run produces one set of checks.
#
# No `paths:` filter here on purpose. A repository-level path filter would leave this job
# out of a PR that only touches pyproject.toml/uv.lock (a Renovate PR, for instance), and a
# check that is required by the ruleset then never reports, which blocks the PR forever.
# The strict build takes about a minute, so it runs on every PR instead.
#
# Documentation dependencies live in the `docs` dependency group in pyproject.toml and are
# resolved from the committed uv.lock (same uv pin as tests.yml and publish-package.yml), so
# the site is built against exactly the versions Read the Docs gets from the same group.
name: Docs build

on:
  workflow_call:

jobs:
  build:
    name: Build mkdocs site
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - name: Install docs dependencies
        run: uv sync --locked --group docs
      - name: Build docs (strict)
        run: uv run --no-sync mkdocs build --strict
